<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diagnóstico simples e personalizado do seu perfil no Instagram com a Mel.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'self'; form-action 'self'">
  <title>Diagnóstico Mel — Clareza para o seu Instagram</title>
</head>
<body>
<main class="diagnostico-container">
  <style>
    :root {
      --mel-vinho: #6B1A2A;
      --mel-vinho-soft: #8B2D3E;
      --mel-vinho-pale: #C47A87;
      --mel-cobre: #C45C3E;
      --mel-cobre-soft: #D98A6E;
      --mel-cream: #F8F5F0;
      --mel-cream-2: #EDE8E0;
      --mel-dark: #1A0F12;
      --mel-dark-soft: #3D2529;
      --mel-line: #D9CFC5;
      --mel-ok: #7C9A72;
      --mel-shadow: 0 12px 40px rgba(26,15,18,.14);
    }
    * { box-sizing: border-box; }
    html { background: var(--mel-cream-2); }
    body {
      margin: 0; min-height: 100vh; color: var(--mel-dark);
      background:
        radial-gradient(circle at 10% 10%, rgba(196,92,62,.16), transparent 30%),
        linear-gradient(145deg, #F8F5F0 0%, #E8DDD3 100%);
    }
    .diagnostico-container {
      font-family: var(--kimi-font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      color: var(--mel-dark); max-width: 720px; margin: 0 auto;
      padding: 24px 16px 60px; line-height: 1.6;
    }
    .brand {
      display: grid; grid-template-columns: minmax(240px, .9fr) 1.1fr;
      min-height: 330px; margin-bottom: 26px; overflow: hidden;
      border-radius: 28px; background: linear-gradient(145deg, var(--mel-vinho), #351018);
      box-shadow: 0 20px 55px rgba(58,17,27,.28); text-align: left;
    }
    .brand-photo { position: relative; min-height: 330px; overflow: hidden; }
    .brand-photo::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 60%, rgba(53,16,24,.38) 100%);
    }
    .brand-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
    .brand-copy { align-self: center; padding: 34px 30px; position: relative; z-index: 1; }
    .brand h1 { font-size: 28px; letter-spacing: 3px; color: #fff; font-weight: 800; text-transform: uppercase; margin: 8px 0 6px; }
    .brand .tagline { font-size: 13px; color: #F5B097; font-weight: 700; letter-spacing: 1.2px; margin: 0; }
    .brand p.brand-description { font-size: 13px; color: #F6EDE8; margin: 12px 0 0; letter-spacing: 0.2px; }
    .step-indicator { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mel-line); transition: all 0.3s ease; }
    .step-dot.active { background: var(--mel-vinho); transform: scale(1.2); }
    .step-dot.completed { background: var(--mel-ok); }
    .card {
      background: #fff; border-radius: 20px; box-shadow: var(--mel-shadow);
      padding: 28px 24px; border: 1px solid var(--mel-line); margin-bottom: 20px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .step-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--mel-cobre); font-weight: 700; margin-bottom: 8px; }
    h2.question { font-size: 22px; font-weight: 700; color: var(--mel-dark); margin-bottom: 6px; line-height: 1.3; }
    .hint { font-size: 14px; color: var(--mel-dark-soft); margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .option {
      border: 1.5px solid var(--mel-line); border-radius: 14px; padding: 14px 16px;
      background: var(--mel-cream); cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; gap: 12px; font-size: 15px; font-family: inherit;
      color: var(--mel-dark); width: 100%; text-align: left;
    }
    .option:hover { border-color: var(--mel-vinho-pale); background: #FDF8F5; }
    .option.selected { border-color: var(--mel-vinho); background: #F5E8EB; }
    .option .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--mel-vinho-pale); flex-shrink: 0; transition: all 0.15s; }
    .option.selected .dot { background: var(--mel-vinho); border-color: var(--mel-vinho); box-shadow: inset 0 0 0 3px #fff; }
    .option b { font-weight: 600; }
    .option small { display: block; color: var(--mel-dark-soft); font-weight: 400; font-size: 12.5px; margin-top: 2px; }
    .options.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .options.grid .option { flex-direction: column; align-items: flex-start; text-align: left; }
    textarea, input[type="text"] {
      width: 100%; border: 1.5px solid var(--mel-line); border-radius: 12px; padding: 13px 14px;
      font-size: 15px; font-family: inherit; color: var(--mel-dark); background: var(--mel-cream); resize: vertical; transition: border-color 0.2s;
    }
    textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--mel-vinho); }
    textarea { min-height: 90px; }
    .field-error { color: #A33D2B; font-size: 13px; font-weight: 600; margin-top: 8px; }
    label.field-label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; color: var(--mel-dark); }
    .drop-zone {
      border: 2px dashed var(--mel-vinho-pale); border-radius: 16px; padding: 32px 24px;
      text-align: center; background: var(--mel-cream); cursor: pointer; transition: all 0.15s; color: var(--mel-dark-soft);
    }
    .drop-zone:hover { background: #F5E8EB; border-color: var(--mel-vinho); }
    .drop-zone b { color: var(--mel-vinho); display: block; font-size: 16px; margin-bottom: 4px; }
    .drop-zone.has-image { border-style: solid; border-color: var(--mel-vinho); background: #F5E8EB; }
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .preview-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 1px solid var(--mel-line); }
    .nav-buttons { display: flex; gap: 12px; margin-top: 24px; }
    button.btn { flex: 1; border: none; border-radius: 14px; padding: 15px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; letter-spacing: 0.5px; }
    .btn-primary { background: var(--mel-vinho); color: #fff; }
    .btn-primary:hover { background: #4A121E; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--mel-dark-soft); border: 1.5px solid var(--mel-line); flex: 0 0 auto; padding: 15px 22px; }
    .btn-ghost:hover { background: #fff; }
    .hidden { display: none !important; }
    .result-header { text-align: center; margin-bottom: 20px; }
    .result-header .tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--mel-cobre); font-weight: 700; }
    .result-header h2 { font-size: 26px; font-weight: 800; margin: 6px 0; color: var(--mel-dark); }
    .result-header .name { color: var(--mel-vinho); }
    .block { border-top: 1px solid var(--mel-line); padding: 22px 0; }
    .block:first-of-type { border-top: none; }
    .block h3 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--mel-vinho); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .block h3 .num { width: 24px; height: 24px; border-radius: 50%; background: var(--mel-vinho); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    .frase-destaque { font-size: 18px; font-weight: 700; color: var(--mel-dark); background: #F5E8EB; border-radius: 14px; padding: 18px; border-left: 4px solid var(--mel-vinho); line-height: 1.6; }
    .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .score-item { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 12px; padding: 14px; text-align: center; }
    .score-item .label { font-size: 12px; color: var(--mel-dark-soft); margin-bottom: 4px; }
    .score-item .value { font-size: 22px; font-weight: 700; color: var(--mel-vinho); }
    .score-item .value.low { color: #C4705A; }
    .lista-detalhada { list-style: none; display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; }
    .lista-detalhada li { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 12px; padding: 14px; font-size: 14.5px; line-height: 1.6; }
    .lista-detalhada li b { color: var(--mel-dark); }
    .tag-chip { display: inline-block; background: var(--mel-cream); border: 1.5px solid var(--mel-vinho-pale); border-radius: 50px; padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--mel-dark); margin: 4px 4px 0 0; }
    .acao-box { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .acao-box .acao-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: var(--mel-dark); }
    .acao-box .acao-desc { font-size: 13.5px; color: var(--mel-dark-soft); line-height: 1.5; }
    .warn-box { background: #FDF1E7; border-left: 4px solid var(--mel-cobre); border-radius: 12px; padding: 14px 16px; font-size: 14px; margin-top: 12px; }
    .warn-box b { color: #8B4A2A; }
    .copy-btn { font-size: 12px; color: var(--mel-vinho); cursor: pointer; font-weight: 700; margin-top: 8px; display: inline-block; background: none; border: none; padding: 0; }
    .copy-btn:hover { text-decoration: underline; }
    .plain-intro { font-size: 14px; color: var(--mel-dark-soft); margin: 0 0 18px; }
    .reassurance { background: #FDF1E7; border-radius: 10px; color: var(--mel-dark-soft); font-size: 13px; margin: 0 0 16px; padding: 10px 12px; }
    .simple-card { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 14px; padding: 16px; margin-top: 10px; }
    .simple-card p { margin: 0; }
    .simple-card p + p { margin-top: 8px; }
    .simple-label { display: block; color: var(--mel-vinho); font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 5px; }
    .positive-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .positive-list li { position: relative; padding: 13px 14px 13px 42px; border: 1px solid var(--mel-line); border-radius: 12px; background: var(--mel-cream); font-size: 14.5px; }
    .positive-list li::before { content: '✓'; position: absolute; left: 14px; top: 12px; color: var(--mel-ok); font-weight: 900; }
    .priority-card { border-radius: 16px; padding: 18px; background: linear-gradient(135deg, var(--mel-vinho), #46121D); color: #fff; }
    .priority-card .priority-title { color: #F5B097; font-size: 12px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; margin-bottom: 7px; }
    .priority-card p { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.55; }
    .status-pill { display: inline-block; border-radius: 999px; padding: 5px 11px; margin-bottom: 10px; background: #F5E8EB; color: var(--mel-vinho); font-size: 12px; font-weight: 800; }
    .content-ideas { counter-reset: idea; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .content-ideas li { counter-increment: idea; position: relative; background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 12px; padding: 14px 14px 14px 48px; font-size: 14px; line-height: 1.55; }
    .content-ideas li::before { content: counter(idea); position: absolute; left: 14px; top: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--mel-vinho); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
    .content-format { color: var(--mel-vinho); font-weight: 800; }
    .profile-record { background: var(--mel-dark); color: #fff; border-radius: 20px; padding: 20px; margin-top: 20px; }
    .profile-record h3 { color: #F5B097; margin: 0 0 6px; font-size: 15px; letter-spacing: 1.4px; text-transform: uppercase; }
    .profile-record p { color: #F3E9E5; font-size: 13px; margin: 0 0 16px; }
    .profile-main { width: 100%; max-height: 560px; object-fit: contain; display: block; background: #fff; border-radius: 14px; }
    .profile-thumbs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .profile-thumbs figure { margin: 0; }
    .profile-thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 12px; background: #fff; }
    .profile-caption { color: #EBDCD6; font-size: 11px; margin-top: 5px; text-align: center; }
    .report-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
    .report-actions .btn { flex: 0 1 220px; }
    @media (max-width: 620px) {
      .brand { grid-template-columns: 1fr; }
      .brand-photo { min-height: 310px; }
      .brand-photo::after { background: linear-gradient(0deg, rgba(53,16,24,.42), transparent 42%); }
      .brand-copy { padding: 25px 24px 28px; text-align: center; }
      .brand h1 { font-size: 25px; }
    }
    @media (max-width: 520px) { .options.grid { grid-template-columns: 1fr; } .score-grid { grid-template-columns: 1fr; } .preview-grid { grid-template-columns: repeat(2, 1fr); } .profile-thumbs { grid-template-columns: 1fr; } .card { padding: 22px 18px; } }
    @media print {
      html, body { background: #fff; }
      .brand, .progress-bar, .step-indicator, .report-actions { display: none !important; }
      .diagnostico-container { max-width: none; padding: 0; }
      .card { box-shadow: none; border: 0; padding: 0; }
      .block, .simple-card, .content-ideas li, .positive-list li { break-inside: avoid; }
    }
    .progress-bar { height: 4px; background: var(--mel-line); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--mel-vinho); border-radius: 4px; transition: width 0.4s ease; }
    .insight-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }
    .insight-badge.obs { background: rgba(107,26,42,0.10); color: var(--mel-vinho); }
    .insight-badge.dec { background: rgba(124,154,114,0.15); color: var(--mel-ok); }
    .insight-badge.hip { background: rgba(196,92,62,0.12); color: var(--mel-cobre); }
    .bio-card { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
    .bio-card .bio-tag { font-size: 11px; font-weight: 700; color: var(--mel-vinho); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .bio-card .bio-text { font-size: 15px; line-height: 1.7; color: var(--mel-dark); }
    .bio-card .bio-cta { font-size: 13px; color: var(--mel-dark-soft); margin-top: 10px; font-style: italic; }
    .hero-quote {
      font-size: 12px; font-weight: 800; color: #F0A47E;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;
    }
    .privacy-note { margin-top: 14px; font-size: 12.5px; color: var(--mel-dark-soft); line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>

  <div class="brand">
    <div class="brand-photo">
      <img src="assets/mel.jpg" alt="Mel sorrindo, usando um blazer vinho e headset" width="1122" height="1402">
    </div>
    <div class="brand-copy">
      <div class="hero-quote">Quem vende, vence.</div>
      <h1>Mel</h1>
      <p class="tagline">Clareza para o seu Instagram</p>
      <p class="brand-description">Responda perguntas simples e descubra o que manter, o que ajustar e qual deve ser o seu primeiro passo.</p>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
  <div class="step-indicator" id="stepIndicator"></div>
  <div id="app" aria-live="polite"></div>

  <script>
    const state = { step: 0, answers: {}, images: [], report: null };

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      })[char]);
    }

    const baseQuestions = [
      {
        id: 'nome', type: 'input', label: 'Sobre você',
        question: 'Como você quer ser chamada no diagnóstico?',
        hint: 'Pode ser o seu nome ou o nome da sua marca.',
        placeholder: 'Ex: Ana Silva ou Ateliê Flora'
      },
      {
        id: 'oferta', type: 'text', label: 'Seu trabalho',
        question: 'O que você vende hoje?',
        hint: 'Escreva o nome do serviço ou produto e explique, de forma simples, o que a cliente recebe. Pode ser, por exemplo, uma consultoria ou um bolo personalizado.',
        placeholder: 'Ex: Bolos personalizados para festas, com decoração e entrega'
      },
      {
        id: 'cliente', type: 'text', label: 'Sua cliente',
        question: 'Qual grupo de pessoas tem mais chance de comprar de você agora?',
        hint: 'Escolha um grupo específico. Você não precisa tentar alcançar todo mundo.',
        placeholder: 'Ex: Mães que procuram bolos personalizados para festas infantis',
        reassurance: 'Não existe resposta perfeita. Escreva com as palavras que você usa no dia a dia.'
      },
      {
        id: 'resultado', type: 'text', label: 'O resultado',
        question: 'O que essa pessoa quer conseguir ao contratar você?',
        hint: 'Conte a mudança que ela busca, não apenas o serviço que ela compra.',
        placeholder: 'Ex: Ter uma festa bonita e receber o bolo pronto no horário',
        reassurance: 'Não existe resposta perfeita. Pense no que a cliente espera sentir, resolver ou conquistar.'
      },
      {
        id: 'bio', type: 'text', label: 'Seu perfil hoje',
        question: 'O que está escrito na sua bio hoje?',
        hint: 'Bio é o texto que aparece abaixo do seu nome no perfil. Copie como está no Instagram ou escreva “não tenho”.',
        placeholder: 'Cole aqui as linhas da sua bio atual'
      },
      {
        id: 'destaques', type: 'text', label: 'Seus destaques',
        question: 'Quais destaques aparecem no seu perfil?',
        hint: 'Destaques são os círculos abaixo da bio. Escreva os nomes separados por vírgula ou escreva “não tenho”.',
        placeholder: 'Ex: Sobre mim, Serviços, Clientes, Bastidores'
      },
      {
        id: 'fixados', type: 'text', label: 'Seus posts fixados',
        question: 'Sobre o que falam os seus posts fixados?',
        hint: 'Fixados são os posts que ficam presos no topo do perfil. Escreva um tema por linha ou escreva “não tenho”.',
        placeholder: 'Ex:\nMinha história\nComo comprar\nDepoimento de uma cliente'
      },
      {
        id: 'prova', type: 'text', label: 'O que gera confiança',
        question: 'O que mostra que o seu trabalho funciona?',
        hint: 'Pode ser um resultado, depoimento, experiência profissional ou transformação que você viveu. Se ainda não tiver ou não souber, pode escrever isso.',
        placeholder: 'Ex: Clientes elogiam o sabor e a pontualidade das entregas',
        reassurance: 'Não existe resposta perfeita. Uma prova simples e verdadeira já ajuda.'
      },
      {
        id: 'dificuldade', type: 'choice', label: 'Seu maior desafio',
        question: 'O que está mais difícil no seu Instagram hoje?',
        hint: 'Escolha apenas uma opção. Ela vai definir sua prioridade.',
        options: [
          { value: 'clareza', label: 'Explicar o que vendo', desc: 'As pessoas não entendem o que eu vendo' },
          { value: 'oferta', label: 'Mostrar como comprar', desc: 'Elas entendem, mas eu quase nunca mostro como funciona ou como comprar' },
          { value: 'conteudo', label: 'Saber o que postar', desc: 'Tenho muitas ideias ou fico sem direção' },
          { value: 'prova', label: 'Mostrar resultados', desc: 'Meu perfil ainda gera pouca confiança' },
          { value: 'venda', label: 'Levar à compra', desc: 'As pessoas acompanham, mas não dão o próximo passo' }
        ]
      },
      {
        id: 'formato', type: 'choice', label: 'Conteúdo possível',
        question: 'Qual formato você consegue criar com mais facilidade?',
        hint: 'As 7 ideias serão adaptadas ao formato que cabe na sua rotina.',
        options: [
          { value: 'carrossel', label: 'Carrossel', desc: 'Post com várias imagens que a pessoa arrasta para o lado' },
          { value: 'reels', label: 'Reels', desc: 'Vídeo curto em que consigo explicar falando ou mostrando' },
          { value: 'stories', label: 'Stories', desc: 'Publicações que somem em 24 horas e mostram o dia a dia' },
          { value: 'misto', label: 'Um pouco de cada', desc: 'Posso alternar formatos durante a semana' }
        ]
      }
    ];

    function cleanSentence(value) {
      return String(value || '').replace(/\s+/g, ' ').trim().replace(/[.!?]+$/, '');
    }

    function compactPhrase(value, fallback, limit = 10) {
      const words = cleanSentence(value).split(/\s+/).filter(Boolean);
      if (!words.length) return fallback;
      const phrase = words.slice(0, limit).join(' ') + (words.length > limit ? '…' : '');
      return phrase.charAt(0).toUpperCase() + phrase.slice(1);
    }

    function limitChars(value, limit) {
      const text = cleanSentence(value);
      if (text.length <= limit) return text;
      const shortened = text.slice(0, limit - 1).replace(/\s+\S*$/, '').trim();
      return `${shortened || text.slice(0, limit - 1)}…`;
    }

    function lowerFirst(value) {
      const text = cleanSentence(value);
      return text ? text.charAt(0).toLowerCase() + text.slice(1) : text;
    }

    function normalize(value) {
      return cleanSentence(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function isMissing(value) {
      const text = normalize(value);
      return /^(?:ainda\s+)?(?:nao(?:\s+(?:tenho|possuo|sei|existe|ha))?|nenhum(?:a)?|nada|sem(?:\s+|$))/i.test(text);
    }

    function meaningfulWords(value) {
      const ignored = new Set(['para', 'como', 'mais', 'uma', 'com', 'que', 'das', 'dos', 'por', 'seu', 'sua', 'meu', 'minha', 'hoje', 'elas', 'eles', 'pessoa', 'mulher', 'mulheres']);
      return normalize(value).split(/[^a-z0-9]+/).filter(word => word.length >= 4 && !ignored.has(word));
    }

    function sharesMeaning(text, reference) {
      const source = normalize(text);
      const sourceWords = meaningfulWords(source);
      const referenceWords = meaningfulWords(reference);
      const hasRelatedWord = referenceWords.some(referenceWord => sourceWords.some(sourceWord => {
        if (sourceWord === referenceWord) return true;
        if (sourceWord.length < 5 || referenceWord.length < 5) return false;
        return sourceWord.slice(0, 5) === referenceWord.slice(0, 5);
      }));
      if (hasRelatedWord) return true;

      const conceptGroups = [
        ['imagem', 'estilo', 'vestir', 'roupa', 'look', 'visual', 'guarda roupa'],
        ['bolo', 'doce', 'confeitaria', 'sobremesa', 'festa'],
        ['beleza', 'maquiagem', 'cosmetico', 'estetica', 'cabelo', 'pele'],
        ['marketing', 'instagram', 'conteudo', 'comunicacao', 'rede social'],
        ['saude', 'nutricao', 'alimentacao', 'dieta', 'bem estar'],
        ['terapia', 'psicologia', 'emocional', 'ansiedade', 'autoestima'],
        ['artesanato', 'feito a mao', 'personalizado', 'decoracao'],
        ['aula', 'curso', 'ensino', 'aprendizado', 'mentoria']
      ];
      return conceptGroups.some(group =>
        group.some(term => source.includes(term)) && group.some(term => normalize(reference).includes(term))
      );
    }

    function splitItems(value) {
      if (isMissing(value)) return [];
      return String(value || '').split(/\n|,|;/).map(cleanSentence).filter(Boolean);
    }

    function joinNatural(items) {
      if (!items.length) return '';
      if (items.length === 1) return items[0];
      return `${items.slice(0, -1).join(', ')} e ${items[items.length - 1]}`;
    }

    function gerarRelatorio() {
      const a = state.answers;
      const nome = a.nome || 'Você';
      const oferta = cleanSentence(a.oferta).replace(/^(eu\s+)?(vendo|ofereço|ofereco|faço|faco|trabalho com)\s+/i, '');
      const cliente = cleanSentence(a.cliente).replace(/^(eu\s+)?(atendo|meu público é|minhas clientes são)\s+/i, '');
      const resultado = cleanSentence(a.resultado).replace(/^(ela|ele|elas|eles)\s+(quer|querem|busca|buscam)\s+/i, '');
      const bio = cleanSentence(a.bio);
      const prova = cleanSentence(a.prova);
      const hasProof = !isMissing(prova);
      const dificuldade = a.dificuldade || 'clareza';
      const formato = a.formato || 'misto';

      const ofertaCurta = compactPhrase(oferta, 'seu serviço principal', 9);
      const clienteCurta = compactPhrase(cliente, 'sua cliente ideal', 10);
      const resultadoCurto = compactPhrase(resultado, 'a mudança que ela procura', 10);
      const provaCurta = hasProof ? compactPhrase(prova, 'um resultado real do seu trabalho', 12) : 'uma primeira prova real do seu trabalho';
      const bioHasOffer = !isMissing(bio) && sharesMeaning(bio, oferta);
      const bioHasClient = !isMissing(bio) && sharesMeaning(bio, cliente);
      const bioHasCTA = /(link|agend|fale|chame|direct|saiba|clique|whats|inscri|entre em contato|comece)/i.test(normalize(bio));

      let comunicacaoAtual;
      if (isMissing(bio)) {
        comunicacaoAtual = `Como você informou que ainda não tem uma bio, quem chega ao perfil pode não entender de imediato que você oferece ${lowerFirst(ofertaCurta)} para ${lowerFirst(clienteCurta)}.`;
      } else if (bioHasOffer && bioHasClient && bioHasCTA) {
        comunicacaoAtual = `Hoje seu perfil já apresenta ${lowerFirst(ofertaCurta)}, mostra para quem esse trabalho é indicado e aponta um próximo passo. A base está clara; agora os destaques e os fixados precisam repetir essa mesma mensagem.`;
      } else if (bioHasOffer && bioHasClient) {
        comunicacaoAtual = `Hoje seu perfil ajuda a entender que você oferece ${lowerFirst(ofertaCurta)} para ${lowerFirst(clienteCurta)}. O que ainda pode ficar mais visível é como conhecer ou comprar essa solução.`;
      } else if (bioHasOffer) {
        comunicacaoAtual = `Hoje seu perfil mostra que você trabalha com ${lowerFirst(ofertaCurta)}, mas ainda não deixa tão evidente que essa solução foi pensada para ${lowerFirst(clienteCurta)}.`;
      } else if (bioHasClient) {
        comunicacaoAtual = `Hoje seu perfil conversa com ${lowerFirst(clienteCurta)}, mas a sua principal solução ainda pode aparecer com mais clareza logo no primeiro contato.`;
      } else {
        comunicacaoAtual = `Hoje seu perfil apresenta o seu trabalho, mas ainda não deixa evidente, em poucos segundos, que você oferece ${lowerFirst(ofertaCurta)} para ${lowerFirst(clienteCurta)}.`;
      }

      const pontosFortes = [
        `Você consegue nomear a sua solução: ${lowerFirst(ofertaCurta)}. Isso dá uma base concreta para organizar o perfil.`,
        `Você sabe quem quer atender e qual mudança essa pessoa procura: ${lowerFirst(resultadoCurto)}.`
      ];
      if (hasProof) pontosFortes.push(`Você já tem um elemento que gera confiança: ${lowerFirst(provaCurta)}. Isso deve ser preservado e ganhar mais espaço.`);

      const ajustes = {
        clareza: {
          titulo: 'Clareza da mensagem',
          explicacao: `A pessoa que chega precisa entender rapidamente três coisas: o que você oferece, para quem e qual resultado isso ajuda a alcançar. Hoje essas respostas ainda podem aparecer de forma mais direta e repetida.`,
          prioridade: `Seu foco nesta semana não é postar mais. É fazer alguém entender, em poucos segundos, que você oferece ${lowerFirst(ofertaCurta)} para ${lowerFirst(clienteCurta)}.`,
          primeiroPasso: 'Use a bio sugerida abaixo e repita a mesma mensagem no primeiro post fixado.'
        },
        oferta: {
          titulo: 'Oferta mais visível',
          explicacao: `Seu conteúdo pode até gerar interesse, mas a pessoa também precisa encontrar ${lowerFirst(ofertaCurta)} sem procurar demais. Mostrar a oferta com clareza não torna o perfil menos próximo; torna a decisão mais fácil.`,
          prioridade: `Sua prioridade nos próximos 7 dias é tornar ${lowerFirst(ofertaCurta)} fácil de encontrar e de entender.`,
          primeiroPasso: 'Fixe um conteúdo que explique o que a cliente recebe, para quem é e como começar.'
        },
        conteudo: {
          titulo: 'Conteúdo mais focado',
          explicacao: `Você não precisa falar de muitos assuntos. O conteúdo deve ajudar ${lowerFirst(clienteCurta)} a reconhecer o problema, desejar ${lowerFirst(resultadoCurto)} e entender como o seu trabalho participa dessa mudança.`,
          prioridade: `Seu foco nos próximos 7 dias é repetir uma mensagem central: como ${lowerFirst(ofertaCurta)} aproxima a cliente de ${lowerFirst(resultadoCurto)}.`,
          primeiroPasso: 'Escolha três das sete ideias abaixo e publique sem abrir um novo assunto nesta semana.'
        },
        prova: {
          titulo: 'Prova mais fácil de encontrar',
          explicacao: hasProof
            ? `A confiança cresce quando a pessoa encontra evidências reais sem precisar procurar. Você já citou ${lowerFirst(provaCurta)}; agora isso precisa aparecer de forma simples nos destaques e nos fixados.`
            : 'A confiança cresce quando a pessoa encontra evidências reais. Como você ainda não registrou uma prova, o próximo passo é reunir uma evidência simples e verdadeira do seu trabalho.',
          prioridade: 'Sua prioridade nos próximos 7 dias é mostrar uma prova real com contexto, não apenas dizer que o seu trabalho funciona.',
          primeiroPasso: hasProof
            ? 'Transforme sua melhor prova em um post fixado com situação inicial, processo e resultado.'
            : 'Peça um depoimento a uma cliente. Se ainda não tiver clientes, mostre seu processo, sua experiência ou uma transformação própria sem inventar resultados.'
        },
        venda: {
          titulo: 'Caminho mais claro para comprar',
          explicacao: `A pessoa pode gostar do perfil e ainda não saber o que fazer depois. Bio, conteúdo e destaques precisam indicar o mesmo próximo passo para conhecer ou comprar ${lowerFirst(ofertaCurta)}.`,
          prioridade: 'Sua prioridade nos próximos 7 dias é deixar um único próximo passo claro em todo o perfil.',
          primeiroPasso: 'Escolha uma chamada simples — link, WhatsApp ou direct — e use a mesma na bio e no post de oferta.'
        }
      };
      const ajuste = ajustes[dificuldade];

      const bioLines = isMissing(a.bio) ? [] : String(a.bio).split(/\n|\|/).map(cleanSentence).filter(Boolean);
      const bioLineToKeep = bioLines.find(line => sharesMeaning(line, oferta) || sharesMeaning(line, cliente) || /(resultado|cliente|anos|atend|depoimento)/i.test(normalize(line)));
      const bioManter = bioLineToKeep
        ? `Mantenha o trecho “${limitChars(bioLineToKeep, 70)}”. Ele já traz uma informação útil sobre o seu trabalho.`
        : 'Mantenha seu nome e o tom que combina com você. O restante da bio pode trabalhar melhor a clareza da oferta.';
      const bioMelhorar = [
        `Coloque “${ofertaCurta}” logo nas primeiras linhas.`,
        `Mostre que é para ${lowerFirst(clienteCurta)}.`,
        bioHasCTA ? 'Mantenha apenas uma chamada para ação e deixe-a bem direta.' : 'Termine com um único convite claro para dar o próximo passo.'
      ];
      const bioSugerida = [
        limitChars(ofertaCurta, 38),
        `Para ${limitChars(lowerFirst(clienteCurta), 34)}`,
        limitChars(resultadoCurto, 42),
        dificuldade === 'venda' ? '↓ Veja como começar' : '↓ Conheça meu trabalho'
      ].join('\n');

      const destaquesAtuais = splitItems(a.destaques);
      const destaqueRelevante = item => /(sobre|comece|servi|mentoria|curso|produto|resultado|depo|cliente|caso|como|duvida|contato|agenda|atend|trabalho|projeto|portfolio|feedback)/i.test(normalize(item));
      const destaquesManter = destaquesAtuais.filter(destaqueRelevante).slice(0, 4);
      const destaquesAjustar = destaquesAtuais.filter(item => !destaqueRelevante(item)).slice(0, 3);
      const ordemDestaques = ['Comece aqui', 'Como funciona', 'Resultados', 'Dúvidas', 'Contato'];
      const destaquesCriar = ordemDestaques.filter(sugestao => !destaquesAtuais.some(atual => sharesMeaning(atual, sugestao))).slice(0, 3);

      const fixadosAtuais = splitItems(a.fixados);
      const fixadosTexto = fixadosAtuais.join(' ');
      const fixadoApresentacao = /(quem sou|minha historia|sobre mim|por que comecei|posicionamento)/i.test(normalize(fixadosTexto));
      const fixadoOferta = sharesMeaning(fixadosTexto, oferta) || /(servi|produto|oferta|como funciona|metodo|atendimento)/i.test(normalize(fixadosTexto));
      const fixadoProva = /(resultado|depo|cliente|caso|case|antes e depois|feedback|transformacao)/i.test(normalize(fixadosTexto));
      const coberturaFixados = [fixadoApresentacao, fixadoOferta, fixadoProva].filter(Boolean).length;
      const statusFixados = coberturaFixados === 3 ? 'Sim' : coberturaFixados === 2 ? 'Em parte' : 'Ainda não';
      const leituraFixados = coberturaFixados === 3
        ? 'Os temas atuais cobrem apresentação, solução e prova. Preserve essa lógica e ajuste apenas os títulos e as chamadas.'
        : coberturaFixados === 2
          ? 'Os fixados ajudam, mas ainda falta uma peça para a pessoa nova entender toda a história: quem você é, o que oferece e por que confiar.'
          : 'Os fixados atuais ainda não formam uma sequência clara para uma pessoa que acabou de chegar ao perfil.';
      const fixadosSugeridos = [
        `Comece aqui: quem é ${nome} e por que criou ${lowerFirst(ofertaCurta)}.`,
        `${ofertaCurta}: para quem é, o que a cliente recebe e como funciona.`,
        hasProof
          ? `Resultado real: mostre ${lowerFirst(provaCurta)} e explique o que tornou esse resultado possível.`
          : 'Como eu trabalho: mostre o processo, a experiência ou uma transformação própria que ajude a gerar confiança.'
      ];

      const formatos = {
        carrossel: ['Carrossel', 'Carrossel', 'Stories', 'Carrossel', 'Carrossel', 'Stories', 'Carrossel'],
        reels: ['Reels', 'Reels', 'Stories', 'Reels', 'Reels', 'Stories', 'Reels'],
        stories: ['Stories', 'Stories', 'Stories', 'Reels curto', 'Stories', 'Stories', 'Stories'],
        misto: ['Carrossel', 'Reels', 'Stories', 'Carrossel', 'Reels', 'Stories', 'Reels']
      }[formato];
      const ideias = [
        { formato: formatos[0], texto: `3 sinais de que é hora de buscar ${lowerFirst(ofertaCurta)}.` },
        { formato: formatos[1], texto: `Mostre uma etapa de ${lowerFirst(ofertaCurta)} que a cliente normalmente não vê e explique por que ela faz diferença.` },
        { formato: formatos[2], texto: hasProof
          ? `Conte um caso ligado a ${lowerFirst(provaCurta)}. Mostre o ponto de partida, o que foi feito e o resultado.`
          : 'Mostre como você trabalha: apresente uma etapa do processo e explique como ela ajuda a cliente.' },
        { formato: formatos[3], texto: `Responda: “${ofertaCurta} é para mim?” Use três situações reais em que a resposta é sim.` },
        { formato: formatos[4], texto: `3 erros que afastam ${lowerFirst(clienteCurta)} de ${lowerFirst(resultadoCurto)}.` },
        { formato: formatos[5], texto: `Abra uma caixinha: “Qual é sua maior dúvida sobre ${lowerFirst(ofertaCurta)}?” e responda a mais recorrente.` },
        { formato: formatos[6], texto: `Convite direto: explique o que é ${lowerFirst(ofertaCurta)}, para quem é e qual é o próximo passo para comprar.` }
      ];

      state.report = {
        nome, ofertaCurta, clienteCurta, resultadoCurto, comunicacaoAtual, pontosFortes,
        ajuste, bioManter, bioMelhorar, bioSugerida, destaquesManter, destaquesAjustar,
        destaquesCriar, ordemDestaques, statusFixados, leituraFixados, fixadosSugeridos, ideias
      };
    }

    function render() {
      const app = document.getElementById('app');
      const indicator = document.getElementById('stepIndicator');
      const progress = document.getElementById('progressFill');
      const totalSteps = baseQuestions.length + 1;
      const current = state.step;
      let dots = '';
      for (let i = 0; i < totalSteps; i++) {
        let c = i < current ? 'completed' : i === current ? 'active' : '';
        dots += `<div class="step-dot ${c}"></div>`;
      }
      indicator.innerHTML = dots;
      progress.style.width = `${Math.min(100, (current / (totalSteps - 1)) * 100)}%`;

      if (state.step < baseQuestions.length) renderQuestion(baseQuestions[state.step]);
      else if (state.step === baseQuestions.length) renderUpload();
      else renderReport();
    }

    function renderQuestion(q) {
      const app = document.getElementById('app');
      let html = '';
      if (q.type === 'text' || q.type === 'input') {
        const field = q.type === 'input'
          ? `<input type="text" id="input-${q.id}" aria-label="${q.question}" placeholder="${q.placeholder}" value="${escapeHTML(state.answers[q.id] || '')}">`
          : `<textarea id="input-${q.id}" aria-label="${q.question}" placeholder="${q.placeholder}">${escapeHTML(state.answers[q.id] || '')}</textarea>`;
        html = `${q.reassurance ? `<p class="reassurance">${q.reassurance}</p>` : ''}<div class="hint">${q.hint}</div>${field}<div class="field-error hidden" id="error-${q.id}" role="alert">Responda esta pergunta para continuar.</div>`;
      } else {
        const sel = state.answers[q.id];
        html = `<div class="hint">${q.hint}</div><div class="options ${q.options.length <= 4 ? 'grid' : ''}">${q.options.map(o => `<button type="button" class="option ${sel === o.value ? 'selected' : ''}" aria-pressed="${sel === o.value}" onclick="selectOption('${q.id}', '${o.value}')"><span class="dot"></span><span><b>${o.label}</b><small>${o.desc}</small></span></button>`).join('')}</div><div class="field-error hidden" id="error-${q.id}" role="alert">Escolha uma opção para continuar.</div>`;
      }
      app.innerHTML = `<div class="card"><div class="step-label">Pergunta ${state.step + 1} de ${baseQuestions.length} · ${q.label}</div><h2 class="question">${q.question}</h2>${html}<div class="nav-buttons"><button class="btn btn-ghost" onclick="prevStep()" ${state.step === 0 ? 'style="visibility:hidden"' : ''}>Voltar</button><button class="btn btn-primary" onclick="nextStep()">Continuar</button></div></div>`;
      if (q.type === 'input') {
        const input = document.getElementById(`input-${q.id}`);
        input.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); nextStep(); } });
        input.focus();
      }
    }

    function renderUpload() {
      document.getElementById('app').innerHTML = `<div class="card"><div class="step-label">Última etapa · Opcional</div><h2 class="question">Quer guardar o “antes”?</h2><div class="hint">Se quiser, envie até 3 prints: 1) perfil e bio, 2) destaques e 3) conteúdos fixados. Eles aparecerão apenas como registro visual no final.</div><p class="reassurance"><b>Importante:</b> as imagens não são analisadas, não saem deste aparelho e não mudam o diagnóstico.</p><div class="drop-zone ${state.images.length > 0 ? 'has-image' : ''}" onclick="document.getElementById('fileInput').click()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('fileInput').click()}"><b>Escolher prints (opcional)</b><span>${state.images.length > 0 ? state.images.length + ' de 3 imagens carregadas' : 'PNG, JPG ou WebP · até 3 arquivos de 8 MB'}</span><input type="file" id="fileInput" class="hidden" accept="image/png,image/jpeg,image/webp" multiple onchange="handleFiles(this)"></div><div class="preview-grid">${state.images.map((img, index) => `<img src="${img}" alt="Prévia do print ${index + 1} do perfil">`).join('')}</div><p class="privacy-note"><b>Privacidade:</b> os arquivos ficam somente neste aparelho e servem apenas para guardar o “antes”.</p><div class="nav-buttons"><button class="btn btn-ghost" onclick="prevStep()">Voltar</button><button class="btn btn-primary" onclick="nextStep()">${state.images.length > 0 ? 'Ver meu diagnóstico' : 'Continuar sem prints'}</button></div></div>`;
    }

    function selectOption(qid, val) { state.answers[qid] = val; render(); }

    function nextStep() {
      if (state.step < baseQuestions.length) {
        const q = baseQuestions[state.step];
        if (q.type === 'text' || q.type === 'input') {
          const field = document.getElementById(`input-${q.id}`);
          const value = field.value.trim();
          if (!value) {
            document.getElementById(`error-${q.id}`).classList.remove('hidden');
            field.focus();
            return;
          }
          state.answers[q.id] = value;
        } else if (!state.answers[q.id]) {
          document.getElementById(`error-${q.id}`).classList.remove('hidden');
          return;
        }
      }

      state.step++;
      if (state.step > baseQuestions.length) gerarRelatorio();
      render();
    }

    function prevStep() { if (state.step > 0) { state.step--; render(); } }

    function handleFiles(input) {
      const allowedTypes = new Set(['image/png', 'image/jpeg', 'image/webp']);
      const maxBytes = 8 * 1024 * 1024;
      const requested = Array.from(input.files);
      const selected = requested.slice(0, 3);
      const files = selected.filter(file => allowedTypes.has(file.type) && file.size <= maxBytes);
      if (requested.length > 3 || files.length !== selected.length) {
        alert('Envie no máximo 3 imagens PNG, JPG ou WebP com até 8 MB cada.');
      }
      state.images = [];
      if (files.length === 0) { renderUpload(); return; }
      Promise.all(files.map(file => new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = event => resolve(event.target.result);
        reader.readAsDataURL(file);
      }))).then(images => { state.images = images; renderUpload(); });
    }

      const app = document.getElementById('app');
      const r = state.report;
      const h = escapeHTML;
      const captions = ['Perfil e bio', 'Destaques', 'Conteúdos fixados'];
      app.innerHTML = `

            <h3><span class="num">6</span> Seu principal ponto de ajuste</h3>
            <div class="simple-card"><span class="simple-label">${h(r.ajuste.titulo)}</span><p>${h(r.ajuste.explicacao)}</p></div>
          </div>
          <div class="block">
            <h3><span class="num">7</span> Bio estratégica</h3>
            <div class="simple-card"><span class="simple-label">O que manter</span><p>${h(r.bioManter)}</p></div>
            <div class="simple-card"><span class="simple-label">O que melhorar</span><ul class="lista-detalhada">${r.bioMelhorar.map(item => `<li>${h(item)}</li>`).join('')}</ul></div>
            <div class="bio-card"><div class="bio-tag">Sugestão pronta</div><div class="bio-text" style="white-space:pre-line">${h(r.bioSugerida)}</div><button class="copy-btn" onclick="copyBio(this)">Copiar bio</button></div>
          </div>
          <div class="block">
            <h3><span class="num">8</span> Destaques</h3>
            <div class="simple-card"><span class="simple-label">Mantenha</span><p>${r.destaquesManter.length ? h(joinNatural(r.destaquesManter)) : 'Nenhum destaque atual foi identificado como essencial para a decisão de compra.'}</p></div>
            <div class="simple-card"><span class="simple-label">Ajuste</span><p>${r.destaquesAjustar.length ? `Renomeie ou retire: ${h(joinNatural(r.destaquesAjustar))}. Esses nomes não ajudam a entender rapidamente o seu trabalho.` : 'Use títulos curtos e diretos para que cada destaque tenha uma função clara.'}</p></div>
            <div class="simple-card"><span class="simple-label">Crie</span><p>${h(joinNatural(r.destaquesCriar)) || 'Sua base de destaques já cobre as informações essenciais.'}</p></div>

          </div>
          <div class="block">
            <h3><span class="num">9</span> Conteúdos fixados</h3>
            <span class="status-pill">${h(r.statusFixados)}</span>
            <p class="plain-intro">${h(r.leituraFixados)}</p>
            <ul class="lista-detalhada">${r.fixadosSugeridos.map((item, index) => `<li><b>Fixado ${index + 1}:</b> ${h(item)}</li>`).join('')}</ul>
          </div>
          <div class="block">
            <h3><span class="num">10</span> 7 conteúdos para testar</h3>
            <ul class="content-ideas">${r.ideias.map(ideia => `<li><span class="content-format">${h(ideia.formato)}:</span> ${h(ideia.texto)}</li>`).join('')}</ul>
          </div>
          <div class="block">
            <h3><span class="num">11</span> Sua prioridade para os próximos 7 dias</h3>
            <div class="priority-card"><div class="priority-title">Comece por aqui</div><p>${h(r.ajuste.prioridade)}</p></div>
            <div class="simple-card"><span class="simple-label">Primeiro passo</span><p>${h(r.ajuste.primeiroPasso)}</p></div>
          </div>
        </div>
        ${state.images.length ? `<div class="profile-record">
          <h3>Seu perfil hoje</h3>
          <p>Este é o registro visual do perfil antes dos ajustes. As imagens não foram analisadas.</p>
          ${state.images[0] ? `<img class="profile-main" src="${state.images[0]}" alt="${captions[0]}">` : ''}
          <div class="profile-thumbs">${state.images.slice(1).map((img, index) => `<figure><img src="${img}" alt="${captions[index + 1] || `Print ${index + 2}`}"><figcaption class="profile-caption">${captions[index + 1] || `Print ${index + 2}`}</figcaption></figure>`).join('')}</div>
          <p class="privacy-note">Os prints ficam neste aparelho. As orientações usam somente as respostas digitadas no questionário.</p>
        </div>` : ''}
        <div class="report-actions"><button class="btn btn-primary" onclick="window.print()">Salvar em PDF ou imprimir</button><button class="btn btn-ghost" onclick="location.reload()">Fazer novo diagnóstico</button></div>
      `;
    }

    function copyBio(btn) {
      const text = state.report?.bioSugerida || '';
      navigator.clipboard.writeText(text).then(() => { btn.textContent = 'Copiado!'; setTimeout(() => btn.textContent = 'Copiar bio', 2000); });
    }

    render();
  </script>
</main>
</body>
</html>
