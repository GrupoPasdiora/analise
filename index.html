<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pré-diagnóstico estratégico de posicionamento no Instagram com a Mel.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'self'; form-action 'self'">
  <title>Diagnóstico Mel — Posicionamento no Instagram</title>
</head>
<body>
<main class="diagnostico-container">
  <style>
    :root {
      --mel-vinho: #6B1A2A;
      --mel-vinho-soft: #8B2D3E;
      --mel-vinho-pale: #C47A87;
      --mel-cobre: #C45C3E;
      --mel-cobre-soft: #D98A6E;
      --mel-cream: #F8F5F0;
      --mel-cream-2: #EDE8E0;
      --mel-dark: #1A0F12;
      --mel-dark-soft: #3D2529;
      --mel-line: #D9CFC5;
      --mel-ok: #7C9A72;
      --mel-shadow: 0 12px 40px rgba(26,15,18,.14);
    }
    * { box-sizing: border-box; }
    html { background: var(--mel-cream-2); }
    body {
      margin: 0; min-height: 100vh; color: var(--mel-dark);
      background:
        radial-gradient(circle at 10% 10%, rgba(196,92,62,.16), transparent 30%),
        linear-gradient(145deg, #F8F5F0 0%, #E8DDD3 100%);
    }
    .diagnostico-container {
      font-family: var(--kimi-font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      color: var(--mel-dark); max-width: 720px; margin: 0 auto;
      padding: 24px 16px 60px; line-height: 1.6;
    }
    .brand {
      display: grid; grid-template-columns: minmax(240px, .9fr) 1.1fr;
      min-height: 330px; margin-bottom: 26px; overflow: hidden;
      border-radius: 28px; background: linear-gradient(145deg, var(--mel-vinho), #351018);
      box-shadow: 0 20px 55px rgba(58,17,27,.28); text-align: left;
    }
    .brand-photo { position: relative; min-height: 330px; overflow: hidden; }
    .brand-photo::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 60%, rgba(53,16,24,.38) 100%);
    }
    .brand-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
    .brand-copy { align-self: center; padding: 34px 30px; position: relative; z-index: 1; }
    .brand h1 { font-size: 28px; letter-spacing: 3px; color: #fff; font-weight: 800; text-transform: uppercase; margin: 8px 0 6px; }
    .brand .tagline { font-size: 13px; color: #F5B097; font-weight: 700; letter-spacing: 1.2px; margin: 0; }
    .brand p.brand-description { font-size: 13px; color: #F6EDE8; margin: 12px 0 0; letter-spacing: 0.2px; }
    .step-indicator { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mel-line); transition: all 0.3s ease; }
    .step-dot.active { background: var(--mel-vinho); transform: scale(1.2); }
    .step-dot.completed { background: var(--mel-ok); }
    .card {
      background: #fff; border-radius: 20px; box-shadow: var(--mel-shadow);
      padding: 28px 24px; border: 1px solid var(--mel-line); margin-bottom: 20px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .step-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--mel-cobre); font-weight: 700; margin-bottom: 8px; }
    h2.question { font-size: 22px; font-weight: 700; color: var(--mel-dark); margin-bottom: 6px; line-height: 1.3; }
    .hint { font-size: 14px; color: var(--mel-dark-soft); margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .option {
      border: 1.5px solid var(--mel-line); border-radius: 14px; padding: 14px 16px;
      background: var(--mel-cream); cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; gap: 12px; font-size: 15px;
    }
    .option:hover { border-color: var(--mel-vinho-pale); background: #FDF8F5; }
    .option.selected { border-color: var(--mel-vinho); background: #F5E8EB; }
    .option .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--mel-vinho-pale); flex-shrink: 0; transition: all 0.15s; }
    .option.selected .dot { background: var(--mel-vinho); border-color: var(--mel-vinho); box-shadow: inset 0 0 0 3px #fff; }
    .option b { font-weight: 600; }
    .option small { display: block; color: var(--mel-dark-soft); font-weight: 400; font-size: 12.5px; margin-top: 2px; }
    .options.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .options.grid .option { flex-direction: column; align-items: flex-start; text-align: left; }
    textarea, input[type="text"] {
      width: 100%; border: 1.5px solid var(--mel-line); border-radius: 12px; padding: 13px 14px;
      font-size: 15px; font-family: inherit; color: var(--mel-dark); background: var(--mel-cream); resize: vertical; transition: border-color 0.2s;
    }
    textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--mel-vinho); }
    textarea { min-height: 90px; }
    label.field-label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; color: var(--mel-dark); }
    .drop-zone {
      border: 2px dashed var(--mel-vinho-pale); border-radius: 16px; padding: 32px 24px;
      text-align: center; background: var(--mel-cream); cursor: pointer; transition: all 0.15s; color: var(--mel-dark-soft);
    }
    .drop-zone:hover { background: #F5E8EB; border-color: var(--mel-vinho); }
    .drop-zone b { color: var(--mel-vinho); display: block; font-size: 16px; margin-bottom: 4px; }
    .drop-zone.has-image { border-style: solid; border-color: var(--mel-vinho); background: #F5E8EB; }
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .preview-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 1px solid var(--mel-line); }
    .nav-buttons { display: flex; gap: 12px; margin-top: 24px; }
    button.btn { flex: 1; border: none; border-radius: 14px; padding: 15px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; letter-spacing: 0.5px; }
    .btn-primary { background: var(--mel-vinho); color: #fff; }
    .btn-primary:hover { background: #4A121E; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--mel-dark-soft); border: 1.5px solid var(--mel-line); flex: 0 0 auto; padding: 15px 22px; }
    .btn-ghost:hover { background: #fff; }
    .hidden { display: none !important; }
    .result-header { text-align: center; margin-bottom: 20px; }
    .result-header .tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--mel-cobre); font-weight: 700; }
    .result-header h2 { font-size: 26px; font-weight: 800; margin: 6px 0; color: var(--mel-dark); }
    .result-header .name { color: var(--mel-vinho); }
    .block { border-top: 1px solid var(--mel-line); padding: 22px 0; }
    .block:first-of-type { border-top: none; }
    .block h3 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--mel-vinho); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .block h3 .num { width: 24px; height: 24px; border-radius: 50%; background: var(--mel-vinho); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    .frase-destaque { font-size: 18px; font-weight: 700; color: var(--mel-dark); background: #F5E8EB; border-radius: 14px; padding: 18px; border-left: 4px solid var(--mel-vinho); line-height: 1.6; }
    .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .score-item { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 12px; padding: 14px; text-align: center; }
    .score-item .label { font-size: 12px; color: var(--mel-dark-soft); margin-bottom: 4px; }
    .score-item .value { font-size: 22px; font-weight: 700; color: var(--mel-vinho); }
    .score-item .value.low { color: #C4705A; }
    .lista-detalhada { list-style: none; display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; }
    .lista-detalhada li { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 12px; padding: 14px; font-size: 14.5px; line-height: 1.6; }
    .lista-detalhada li b { color: var(--mel-dark); }
    .tag-chip { display: inline-block; background: var(--mel-cream); border: 1.5px solid var(--mel-vinho-pale); border-radius: 50px; padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--mel-dark); margin: 4px 4px 0 0; }
    .acao-box { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .acao-box .acao-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: var(--mel-dark); }
    .acao-box .acao-desc { font-size: 13.5px; color: var(--mel-dark-soft); line-height: 1.5; }
    .warn-box { background: #FDF1E7; border-left: 4px solid var(--mel-cobre); border-radius: 12px; padding: 14px 16px; font-size: 14px; margin-top: 12px; }
    .warn-box b { color: #8B4A2A; }
    .copy-btn { font-size: 12px; color: var(--mel-vinho); cursor: pointer; font-weight: 700; margin-top: 8px; display: inline-block; background: none; border: none; padding: 0; }
    .copy-btn:hover { text-decoration: underline; }
    @media (max-width: 620px) {
      .brand { grid-template-columns: 1fr; }
      .brand-photo { min-height: 310px; }
      .brand-photo::after { background: linear-gradient(0deg, rgba(53,16,24,.42), transparent 42%); }
      .brand-copy { padding: 25px 24px 28px; text-align: center; }
      .brand h1 { font-size: 25px; }
    }
    @media (max-width: 520px) { .options.grid { grid-template-columns: 1fr; } .score-grid { grid-template-columns: 1fr; } .preview-grid { grid-template-columns: repeat(2, 1fr); } .card { padding: 22px 18px; } }
    .progress-bar { height: 4px; background: var(--mel-line); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--mel-vinho); border-radius: 4px; transition: width 0.4s ease; }
    .insight-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }
    .insight-badge.obs { background: rgba(107,26,42,0.10); color: var(--mel-vinho); }
    .insight-badge.dec { background: rgba(124,154,114,0.15); color: var(--mel-ok); }
    .insight-badge.hip { background: rgba(196,92,62,0.12); color: var(--mel-cobre); }
    .bio-card { background: var(--mel-cream); border: 1px solid var(--mel-line); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
    .bio-card .bio-tag { font-size: 11px; font-weight: 700; color: var(--mel-vinho); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .bio-card .bio-text { font-size: 15px; line-height: 1.7; color: var(--mel-dark); }
    .bio-card .bio-cta { font-size: 13px; color: var(--mel-dark-soft); margin-top: 10px; font-style: italic; }
    .hero-quote {
      font-size: 12px; font-weight: 800; color: #F0A47E;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;
    }
    .privacy-note { margin-top: 14px; font-size: 12.5px; color: var(--mel-dark-soft); line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>

  <div class="brand">
    <div class="brand-photo">
      <img src="assets/mel.jpg" alt="Mel sorrindo, usando um blazer vinho e headset" width="1122" height="1402">
    </div>
    <div class="brand-copy">
      <div class="hero-quote">Quem vende, vence.</div>
      <h1>Mel</h1>
      <p class="tagline">Diagnóstico de Posicionamento no Instagram</p>
      <p class="brand-description">Sua consultora estratégica para identificar o que fortalece sua mensagem — e o que pode estar te invisibilizando.</p>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
  <div class="step-indicator" id="stepIndicator"></div>
  <div id="app" aria-live="polite"></div>

  <script>
    const state = { step: 0, answers: {}, images: [], adaptativa: [], report: null };

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      })[char]);
    }

    const baseQuestions = [
      { id: 'nome', type: 'text', label: 'Identificação', question: 'Qual é o seu nome ou nome da marca?', hint: 'Como a Mel vai te chamar no relatório?', placeholder: 'Ex: Ana Silva, Ateliê Flora...' },
      { id: 'nicho', type: 'text', label: 'Nicho', question: 'O que você vende e para quem?', hint: 'Descreva sua oferta principal e sua cliente ideal em uma frase.', placeholder: 'Ex: Ajudo mães empreendedoras a organizarem a rotina sem culpa...' },
      { id: 'preco', type: 'choice', label: 'Modelo de negócio', question: 'Qual é a faixa de preço da sua oferta principal?', options: [
        { value: 'baixo', label: 'Até R$ 300', desc: 'Produtos digitais de entrada, ebooks, planners' },
        { value: 'medio', label: 'R$ 300 a R$ 2.000', desc: 'Cursos, mentorias em grupo, serviços' },
        { value: 'alto', label: 'Acima de R$ 2.000', desc: 'Mentorias 1:1, consultorias, serviços premium' }
      ]},
      { id: 'momento', type: 'choice', label: 'Jornada da cliente', question: 'Em que momento da vida sua cliente procura você?', options: [
        { value: 'dor', label: 'No auge da dor', desc: 'Ela está desesperada, precisa de solução agora' },
        { value: 'transicao', label: 'Em transição', desc: 'Mudança de fase, carreira, relacionamento, maternidade' },
        { value: 'crescimento', label: 'Buscando crescimento', desc: 'Já está bem, mas quer ir para o próximo nível' }
      ]},
      { id: 'medo', type: 'text', label: 'Psicologia da persona', question: 'Qual medo, vergonha ou frustração sua cliente não verbaliza?', hint: 'O que ela pensa mas não conta nem para amigas próximas?', placeholder: 'Ex: Tenho medo de ser uma péssima mãe por não conseguir conciliar tudo...' },
      { id: 'tentou', type: 'text', label: 'Histórico de tentativas', question: 'O que ela já tentou e por que não funcionou?', hint: 'Isso ajuda a Mel a posicionar sua solução como a verdadeira resposta.', placeholder: 'Ex: Já comprou vários cursos genéricos, mas nenhum considerava a realidade dela...' },
      { id: 'transformacao', type: 'text', label: 'Transformação', question: 'Qual transformação concreta e emocional seu serviço proporciona?', hint: 'O "antes e depois" real da vida dela.', placeholder: 'Ex: De sobrecarregada e culpada para tranquila e presente...' },
      { id: 'historia', type: 'text', label: 'Legitimidade', question: 'Qual história pessoal dá legitimidade ao seu trabalho?', hint: 'Por que VOCÊ é a pessoa certa para resolver isso?', placeholder: 'Ex: Passei pelo mesmo burnout que minhas clientes e desenvolvi um método...' },
      { id: 'conteudo', type: 'choice', label: 'Produção de conteúdo', question: 'Que tipo de conteúdo você consegue produzir com constância?', options: [
        { value: 'texto', label: 'Texto e carrosséis', desc: 'Escrever é seu forte' },
        { value: 'video', label: 'Vídeos e Reels', desc: 'Se expressa bem em vídeo' },
        { value: 'audio', label: 'Áudio e Stories', desc: 'Conversa natural e próxima' },
        { value: 'visual', label: 'Fotografia e design', desc: 'Olhar estético apurado' }
      ]},
      { id: 'objetivo', type: 'choice', label: 'Objetivo estratégico', question: 'Qual é seu objetivo principal no Instagram hoje?', options: [
        { value: 'autoridade', label: 'Construir autoridade', desc: 'Ser reconhecida como referência' },
        { value: 'vendas', label: 'Aumentar vendas', desc: 'Converter seguidores em clientes' },
        { value: 'conexao', label: 'Fortalecer conexão', desc: 'Criar comunidade fiel' },
        { value: 'visibilidade', label: 'Ganhar visibilidade', desc: 'Alcance e reconhecimento' }
      ]}
    ];

    const adaptiveQuestions = {
      autoridade: { id: 'adapt_autoridade', question: 'Você mencionou autoridade. O que diferencia seu método do que já existe no mercado?', hint: 'Seja específica. Não vale dizer "eu me importo mais".', placeholder: 'Ex: Meu método considera o ciclo menstrual na produtividade...' },
      vendas: { id: 'adapt_vendas', question: 'Você quer vender mais. Qual é a principal objeção que ouve de potenciais clientes?', hint: 'A Mel vai usar isso para criar conteúdo de quebra de objeções.', placeholder: 'Ex: "Não tenho tempo", "É muito caro", "Já tentei e não deu certo"...' },
      conexao: { id: 'adapt_conexao', question: 'Você quer conexão. Quais são os 3 valores não negociáveis que você comunica?', hint: 'O que você nunca abriria mão de dizer, mesmo que perdesse seguidores?', placeholder: 'Ex: Honestidade, vulnerabilidade, liberdade...' },
      visibilidade: { id: 'adapt_visibilidade', question: 'Você quer visibilidade. O que você faz diferente que poderia viralizar?', hint: 'Pense em formatos, ângulos ou opiniões contrárias ao senso comum.', placeholder: 'Ex: Mostro a realidade por trás de um negócio de 6 dígitos...' },
      dor: { id: 'adapt_dor', question: 'Sua cliente está na dor. O que acontece numa terça-feira comum na vida dela?', hint: 'Descreva uma cena específica. Isso torna a persona reconhecível.', placeholder: 'Ex: Acorda às 6h, já estressada, com 47 mensagens no WhatsApp...' },
      transicao: { id: 'adapt_transicao', question: 'Ela está em transição. O que ela precisa ouvir para se sentir segura de investir?', hint: 'Qual é a prova social ou argumento que tira o medo dela?', placeholder: 'Ex: Ver que outras mulheres na mesma fase conseguiram...' },
      crescimento: { id: 'adapt_crescimento', question: 'Ela busca crescimento. O que ela já conquistou e qual é o próximo nível?', hint: 'Posicione seu serviço como a ponte entre onde ela está e onde quer chegar.', placeholder: 'Ex: Já tem renda, mas quer escalabilidade sem burnout...' }
    };

    function cleanSentence(value) {
      return String(value || '').replace(/\s+/g, ' ').trim().replace(/[.!?]+$/, '');
    }

    function compactPhrase(value, fallback, limit = 10) {
      const words = cleanSentence(value).split(/\s+/).filter(Boolean);
      if (!words.length) return fallback;
      const phrase = words.slice(0, limit).join(' ') + (words.length > limit ? '…' : '');
      return phrase.charAt(0).toUpperCase() + phrase.slice(1);
    }

    function gerarRelatorio() {
      const a = state.answers;
      const nome = a.nome || 'Você';
      const nicho = a.nicho || '';
      const preco = a.preco || 'medio';
      const momento = a.momento || 'transicao';
      const medo = a.medo || '';
      const tentou = a.tentou || '';
      const transformacao = a.transformacao || '';
      const historia = a.historia || '';
      const conteudo = a.conteudo || 'texto';
      const objetivo = a.objetivo || 'autoridade';
      const respostasAdaptativas = state.adaptativa
        .map(pergunta => ({ pergunta: pergunta.question, resposta: a[pergunta.id] || '' }))
        .filter(item => item.resposta);

      const temaNicho = compactPhrase(nicho, 'Seu mercado');
      const temaMedo = compactPhrase(medo.replace(/^tem\s+medo\s+de\s*/i, ''), 'A dor escondida');
      const temaTransformacao = compactPhrase(transformacao, 'Transformação real');
      const temaTentativa = compactPhrase(tentou.replace(/^já\s+tentou\s*/i, '').split(/[,.]/)[0], 'Tentativas frustradas');
      const respostaObjetivo = cleanSentence(a[`adapt_${objetivo}`]);
      const respostaMomento = cleanSentence(a[`adapt_${momento}`]);

      const scores = {
        clareza: Math.min(95, 60 + (nicho.length > 30 ? 20 : 10) + (transformacao ? 15 : 0)),
        diferenciacao: Math.min(95, 50 + (historia.length > 20 ? 25 : 10) + (medo ? 15 : 0)),
        conexao: Math.min(95, 55 + (momento === 'dor' ? 20 : 10) + (medo.length > 20 ? 15 : 0)),
        autoridade: Math.min(95, 50 + (objetivo === 'autoridade' ? 25 : 10) + (historia ? 15 : 0)),
        prova: Math.min(95, 45 + (tentou.length > 20 ? 25 : 10)),
        conversao: Math.min(95, 50 + (preco === 'alto' ? 15 : 5) + (objetivo === 'vendas' ? 20 : 10))
      };
      const media = Math.round((scores.clareza + scores.diferenciacao + scores.conexao + scores.autoridade + scores.prova + scores.conversao) / 6);

      let diagnostico = '';
      if (scores.clareza < 70) {
        diagnostico = `Hoje, o que mais impede ${nome} de conectar e vender é a falta de clareza na comunicação do problema real da cliente. O posicionamento está vendendo uma solução, mas a persona ainda não se reconheceu na dor. O caminho é tirar a culpa dela antes de apresentar qualquer método.`;
      } else if (scores.conexao < 70) {
        diagnostico = `O posicionamento tem estrutura, mas falta profundidade emocional. A cliente não se sente vista no nível mais íntimo — aquela vergonha que ela não conta para ninguém. O conteúdo precisa nomear o que ela sente antes de propor qualquer solução.`;
      } else if (scores.conversao < 65) {
        diagnostico = `A conexão existe, mas o caminho entre o conteúdo e a oferta está quebrado. A cliente não sabe exatamente quando e como comprar. O próximo passo é criar pontes claras entre cada post e a transformação que o serviço entrega.`;
      } else {
        diagnostico = `O posicionamento de ${nome} tem boa base, mas falta o diferencial inegociável — aquela verdade que só ela pode dizer daquele jeito. O mercado está esperando que ela ocupe um território único, e não mais um espaço genérico.`;
      }

      const bios = [];
      bios.push({
        tag: 'Ângulo Contrarian',
        texto: `A maioria das pessoas que fala sobre ${temaNicho.toLowerCase()} não conta uma coisa: ${tentou ? 'o que você já tentou não falhou por falta de esforço. Falhou porque foi feito para uma realidade diferente da sua.' : 'a solução não está em fazer mais. Está em fazer diferente.'} ${historia ? 'Eu descobri isso na prática. ' + cleanSentence(historia) + '.' : 'E é exatamente isso que eu ensino.'}`,
        cta: 'Posicionamento: você é a pessoa que fala o que outros escondem.'
      });
      bios.push({
        tag: 'Ângulo Reframe',
        texto: `${medo ? 'Se você sente que ' + cleanSentence(medo).toLowerCase() + ', saiba uma coisa: não é culpa sua.' : 'Se você já tentou de tudo e nada funcionou, saiba: não é culpa sua.'} ${transformacao ? 'A transformação que eu ofereço não começa com mais uma técnica. O destino é claro: ' + cleanSentence(transformacao).toLowerCase() + '.' : 'A transformação começa quando você para de se culpar.'}`,
        cta: 'Posicionamento: você tira a culpa antes de vender a solução.'
      });
      bios.push({
        tag: 'Ângulo Método',
        texto: `${historia ? cleanSentence(historia) + '. Por isso desenvolvi um caminho que não exige que você viva a mesma rotina insustentável.' : 'Eu não acredito em fórmulas prontas. Acredito em caminhos possíveis.'} ${transformacao ? 'O resultado? ' + cleanSentence(transformacao) + '.' : 'O resultado é uma transformação real, não apenas mais informação.'}`,
        cta: 'Posicionamento: método nascido de experiência, não de teoria.'
      });

      const territorios = [
        { nome: 'O que ninguém te conta sobre ' + temaNicho.toLowerCase(), tipo: 'Série de autoridade' },
        { nome: 'Por que ' + temaTentativa.toLowerCase() + ' não funcionou', tipo: 'Série de conexão' },
        { nome: 'Da dor à transformação: ' + temaTransformacao.toLowerCase(), tipo: 'Série de prova' },
        { nome: 'O que ela não conta: ' + temaMedo.toLowerCase(), tipo: 'Série de conexão profunda' }
      ];

      const plano30 = [];
      plano30.push({
        semana: 'Semana 1 — Conexão',
        acao: `Série "O que ela não conta: ${temaMedo.toLowerCase()}": 3 posts desconstruindo a crença errada que sua cliente carrega. Cada post nomeia uma culpa que não é dela.${respostaMomento ? ` Parta desta cena real: “${respostaMomento}”.` : ''}`,
        formato: conteudo === 'video' ? 'Reels com áudio direto' : 'Carrossel com texto corrido',
        cta: 'Salva se você se identificou'
      });
      plano30.push({
        semana: 'Semana 2 — Autoridade',
        acao: `Conteúdo "Como eu cheguei aqui": sua história de ${historia ? 'como você desenvolveu seu método' : 'por que você faz o que faz'} e o momento em que percebeu que o mercado estava ensinando errado.`,
        formato: conteudo === 'video' ? 'Vídeo longo ou Reels em partes' : 'Carrossel com legenda que conta uma história',
        cta: 'Comenta se você já passou por isso'
      });
      plano30.push({
        semana: 'Semana 3 — Prova',
        acao: `Case real: mostre o antes e depois descrito por você${transformacao ? ` — “${cleanSentence(transformacao)}”` : ''}. Não mostre só números. Mostre como ela se sente hoje.`,
        formato: conteudo === 'video' ? 'Reels com depoimento em áudio' : 'Carrossel com prints e storytelling',
        cta: 'Link na bio para conhecer o método'
      });
      const temaOferta = objetivo === 'vendas' ? 'por que agora é o momento' : 'o próximo passo';
      plano30.push({
        semana: 'Semana 4 — Oferta',
        acao: objetivo === 'vendas' && respostaObjetivo
          ? `Quebra de objeção: transforme “${respostaObjetivo}” em uma sequência de 3 conteúdos — acolha a dúvida, mostre uma prova e apresente o próximo passo.`
          : `Série "${temaOferta.charAt(0).toUpperCase() + temaOferta.slice(1)}": desmistifique o investimento. Mostre que o custo de não resolver o problema é maior que o custo da solução.`,
        formato: conteudo === 'video' ? 'Stories em sequência + Reels' : 'Carrossel + Stories',
        cta: 'DM com a palavra CAMINHO'
      });

      const acoes = [
        { prazo: 'Hoje', acao: 'Reescrever a bio usando um dos 3 ângulos sugeridos. Elimine "ajudo", "ensino" e "especialista".', impacto: 'Alta' },
        { prazo: '7 dias', acao: `Criar série de 3 posts nomeando a dor real: ${temaMedo.toLowerCase()}. Não venda. Apenas nomeie.`, impacto: 'Alta' },
        { prazo: '7 dias', acao: 'Reorganizar destaques: 1. Quem sou (história) 2. O método 3. Resultados 4. Depoimentos 5. Como funciona', impacto: 'Média' },
        { prazo: '30 dias', acao: `Estabelecer uma série fixa semanal: "${territorios[0].nome}". Constância é mais importante que volume.`, impacto: 'Alta' },
        { prazo: '30 dias', acao: 'Criar uma CTA única e repetida em todos os posts (ex: DM com CAMINHO).', impacto: 'Alta' }
      ];

      state.report = { scores, media, diagnostico, bios, territorios, plano30, acoes, nicho, temaNicho, momento, objetivo, nome, respostasAdaptativas };
    }

    function render() {
      const app = document.getElementById('app');
      const indicator = document.getElementById('stepIndicator');
      const progress = document.getElementById('progressFill');
      const totalSteps = baseQuestions.length + 1 + state.adaptativa.length + 1;
      const current = state.step;
      let dots = '';
      for (let i = 0; i < totalSteps; i++) {
        let c = i < current ? 'completed' : i === current ? 'active' : '';
        dots += `<div class="step-dot ${c}"></div>`;
      }
      indicator.innerHTML = dots;
      progress.style.width = `${(current / (totalSteps - 1)) * 100}%`;

      if (state.step < baseQuestions.length) renderQuestion(baseQuestions[state.step]);
      else if (state.step === baseQuestions.length) renderUpload();
      else if (state.step < baseQuestions.length + 1 + state.adaptativa.length) renderAdaptive(state.adaptativa[state.step - baseQuestions.length - 1]);
      else renderReport();
    }

    function renderQuestion(q) {
      const app = document.getElementById('app');
      let html = '';
      if (q.type === 'text') {
        html = `<div class="hint">${q.hint}</div><textarea id="input-${q.id}" aria-label="${q.question}" placeholder="${q.placeholder}">${escapeHTML(state.answers[q.id] || '')}</textarea>`;
      } else {
        const sel = state.answers[q.id];
        html = `<div class="step-label">${q.label}</div><h2 class="question">${q.question}</h2><div class="options ${q.options.length <= 4 ? 'grid' : ''}">${q.options.map(o => `<div class="option ${sel === o.value ? 'selected' : ''}" onclick="selectOption('${q.id}', '${o.value}')"><div class="dot"></div><div><b>${o.label}</b><small>${o.desc}</small></div></div>`).join('')}</div>`;
      }
      app.innerHTML = `<div class="card">${q.type === 'text' ? `<div class="step-label">${q.label}</div><h2 class="question">${q.question}</h2>` : ''}${html}<div class="nav-buttons"><button class="btn btn-ghost" onclick="prevStep()" ${state.step === 0 ? 'style="visibility:hidden"' : ''}>Voltar</button><button class="btn btn-primary" onclick="nextStep()">Continuar</button></div></div>`;
      if (q.type === 'text') {
        const ta = document.getElementById(`input-${q.id}`);
        ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); nextStep(); } });
      }
    }

    function renderUpload() {
      document.getElementById('app').innerHTML = `<div class="card"><div class="step-label">Evidências visuais</div><h2 class="question">Envie prints do seu perfil</h2><div class="hint">Reúna até 3 imagens: cabeçalho/bio, feed (12–18 posts) e um conteúdo representativo.</div><div class="drop-zone ${state.images.length > 0 ? 'has-image' : ''}" onclick="document.getElementById('fileInput').click()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('fileInput').click()}"><b>Clique para enviar imagens</b><span>${state.images.length > 0 ? state.images.length + ' imagem(ns) carregada(s)' : 'PNG, JPG ou WebP · até 3 arquivos de 8 MB'}</span><input type="file" id="fileInput" class="hidden" accept="image/png,image/jpeg,image/webp" multiple onchange="handleFiles(this)"></div><div class="preview-grid">${state.images.map(img => `<img src="${img}" alt="Prévia de um print do perfil">`).join('')}</div><p class="privacy-note"><b>Privacidade:</b> os arquivos ficam somente neste aparelho. Nesta versão, eles são guardados como referência para o antes e depois; a leitura automática por IA será ativada apenas quando houver um backend seguro.</p><div class="nav-buttons"><button class="btn btn-ghost" onclick="prevStep()">Voltar</button><button class="btn btn-primary" onclick="nextStep()" ${state.images.length === 0 ? 'disabled' : ''}>Gerar diagnóstico</button></div></div>`;
    }

    function renderAdaptive(q) {
      document.getElementById('app').innerHTML = `<div class="card"><div class="step-label">Pergunta adaptativa</div><h2 class="question">${q.question}</h2><div class="hint">${q.hint}</div><textarea id="input-${q.id}" placeholder="${q.placeholder}">${escapeHTML(state.answers[q.id] || '')}</textarea><div class="nav-buttons"><button class="btn btn-ghost" onclick="prevStep()">Voltar</button><button class="btn btn-primary" onclick="nextStep()">Continuar</button></div></div>`;
    }

    function selectOption(qid, val) { state.answers[qid] = val; render(); }

    function nextStep() {
      if (state.step < baseQuestions.length) {
        const q = baseQuestions[state.step];
        if (q.type === 'text') { const v = document.getElementById(`input-${q.id}`).value.trim(); if (!v) return; state.answers[q.id] = v; }
        else if (!state.answers[q.id]) return;
      } else if (state.step === baseQuestions.length) { if (state.images.length === 0) return; }
      else if (state.step > baseQuestions.length && state.step < baseQuestions.length + 1 + state.adaptativa.length) {
        const idx = state.step - baseQuestions.length - 1;
        const q = state.adaptativa[idx];
        const v = document.getElementById(`input-${q.id}`).value.trim(); if (!v) return; state.answers[q.id] = v;
      }

      if (state.step === baseQuestions.length - 1) {
        const obj = state.answers.objetivo;
        const mom = state.answers.momento;
        state.adaptativa = [];
        if (adaptiveQuestions[obj]) state.adaptativa.push(adaptiveQuestions[obj]);
        if (adaptiveQuestions[mom] && mom !== obj) state.adaptativa.push(adaptiveQuestions[mom]);
        if (state.adaptativa.length === 0) state.adaptativa.push({ id: 'adapt_geral', question: 'Se você pudesse resolver UM problema da sua cliente hoje, qual seria?', hint: 'Pense na transformação mais imediata e valiosa.', placeholder: 'Ex: Fazer ela dormir tranquila sabendo que está no caminho certo...' });
      }

      state.step++;
      if (state.step >= baseQuestions.length + 1 + state.adaptativa.length) gerarRelatorio();
      render();
    }

    function prevStep() { if (state.step > 0) { state.step--; render(); } }

    function handleFiles(input) {
      const allowedTypes = new Set(['image/png', 'image/jpeg', 'image/webp']);
      const maxBytes = 8 * 1024 * 1024;
      const selected = Array.from(input.files).slice(0, 3);
      const files = selected.filter(file => allowedTypes.has(file.type) && file.size <= maxBytes);
      if (files.length !== selected.length) {
        alert('Use somente imagens PNG, JPG ou WebP com até 8 MB cada.');
      }
      state.images = [];
      if (files.length === 0) { renderUpload(); return; }
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => { state.images.push(e.target.result); loaded++; if (loaded === files.length) renderUpload(); };
        reader.readAsDataURL(file);
      });
    }

    function renderReport() {
      const app = document.getElementById('app');
      const r = state.report;
      const h = escapeHTML;
      app.innerHTML = `
        <div class="result-header"><div class="tag">Pré-diagnóstico estratégico</div><h2>Posicionamento de <span class="name">${h(r.nome)}</span></h2></div>
        <div class="card">
          <div class="block">
            <h3><span class="num">1</span> Diagnóstico central</h3>
            <div class="frase-destaque">${h(r.diagnostico)}</div>
          </div>
          <div class="block">
            <h3><span class="num">2</span> Indicadores iniciais</h3>
            <div class="score-grid">
              <div class="score-item"><div class="label">Clareza</div><div class="value ${r.scores.clareza < 70 ? 'low' : ''}">${r.scores.clareza}</div></div>
              <div class="score-item"><div class="label">Diferenciação</div><div class="value ${r.scores.diferenciacao < 70 ? 'low' : ''}">${r.scores.diferenciacao}</div></div>
              <div class="score-item"><div class="label">Conexão</div><div class="value ${r.scores.conexao < 70 ? 'low' : ''}">${r.scores.conexao}</div></div>
              <div class="score-item"><div class="label">Autoridade</div><div class="value ${r.scores.autoridade < 70 ? 'low' : ''}">${r.scores.autoridade}</div></div>
              <div class="score-item"><div class="label">Prova</div><div class="value ${r.scores.prova < 70 ? 'low' : ''}">${r.scores.prova}</div></div>
              <div class="score-item"><div class="label">Conversão</div><div class="value ${r.scores.conversao < 65 ? 'low' : ''}">${r.scores.conversao}</div></div>
            </div>
            <div style="text-align:center; margin-top:12px; font-size:14px; color:var(--mel-dark-soft)">Média geral: <b style="color:var(--mel-dark); font-size:18px">${r.media}/100</b></div>
            <p class="privacy-note" style="text-align:center">Esses indicadores refletem a completude e a coerência das respostas. Não são métricas oficiais de desempenho do Instagram.</p>
          </div>
          <div class="block">
            <h3><span class="num">3</span> Bios estratégicas — fora dos clichês</h3>
            ${r.bios.map((bio, i) => `
              <div class="bio-card">
                <div class="bio-tag">${h(bio.tag)}</div>
                <div class="bio-text">${h(bio.texto)}</div>
                <div class="bio-cta">${h(bio.cta)}</div>
                <button class="copy-btn" onclick="copyBio(this, ${i})">Copiar bio</button>
              </div>
            `).join('')}
            <div class="warn-box"><b>Dica da Mel:</b> Evite "ajudo", "ensino", "especialista em" e "transformo vidas". Essas palavras invisibilizam você no feed. Use ângulos que só você pode sustentar.</div>
          </div>
          <div class="block">
            <h3><span class="num">4</span> Territórios de conteúdo exclusivos</h3>
            <p style="font-size:14px; color:var(--mel-dark-soft); margin-bottom:12px">Séries que só você pode sustentar:</p>
            ${r.territorios.map(t => `<span class="tag-chip">${h(t.nome)}</span>`).join('')}
            <div style="margin-top:12px; font-size:13px; color:var(--mel-dark-soft)">${r.territorios.map(t => `<div style="margin-bottom:4px">• <b>${h(t.nome)}</b> — ${h(t.tipo)}</div>`).join('')}</div>
          </div>
          <div class="block">
            <h3><span class="num">5</span> Plano editorial — 30 dias</h3>
            ${r.plano30.map(p => `
              <div class="acao-box">
                <div class="acao-title">${h(p.semana)}</div>
                <div class="acao-desc"><b>Ação:</b> ${h(p.acao)}<br><b>Formato:</b> ${h(p.formato)}<br><b>CTA:</b> ${h(p.cta)}</div>
              </div>
            `).join('')}
          </div>
          <div class="block">
            <h3><span class="num">6</span> Plano de ação priorizado</h3>
            ${r.acoes.map(a => `
              <div style="display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; padding:12px; background:var(--mel-cream); border-radius:10px; border:1px solid var(--mel-line)">
                <div style="min-width:70px; font-size:12px; font-weight:700; color:var(--mel-vinho)">${h(a.prazo)}</div>
                <div style="flex:1">
                  <div style="font-size:14px; font-weight:600; color:var(--mel-dark)">${h(a.acao)}</div>
                  <div style="font-size:12px; color:var(--mel-dark-soft)">Impacto: ${h(a.impacto)}</div>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="block">
            <h3><span class="num">7</span> Evidências e próximos passos</h3>
            <div class="insight-badge obs">📸 ${state.images.length} print(s) anexado(s)</div>
            <ul class="lista-detalhada">
              <li><b>Uso dos prints:</b> os arquivos ficam no navegador como registro do perfil atual. Eles não foram interpretados automaticamente nesta versão.</li>
              <li><b>Próxima evolução:</b> quando o backend seguro de IA estiver conectado, a leitura poderá avaliar bio, destaques, feed e coerência visual com evidências específicas.</li>
            </ul>
            <div class="insight-badge dec" style="margin-top:12px">💬 Declarado no questionário</div>
            <ul class="lista-detalhada">
              <li><b>Persona:</b> Mulher em fase de ${r.momento === 'dor' ? 'dor aguda' : r.momento === 'transicao' ? 'transição' : 'crescimento'}, buscando uma solução ligada a ${h(r.temaNicho.toLowerCase())}.</li>
              <li><b>Objetivo:</b> ${r.objetivo === 'autoridade' ? 'Construir autoridade' : r.objetivo === 'vendas' ? 'Aumentar vendas' : r.objetivo === 'conexao' ? 'Fortalecer conexão' : 'Ganhar visibilidade'}.</li>
              ${r.respostasAdaptativas.map(item => `<li><b>${h(item.pergunta)}</b><br>${h(item.resposta)}</li>`).join('')}
            </ul>
            <div class="insight-badge hip" style="margin-top:12px">💡 Recomendação inicial</div>
            <ul class="lista-detalhada">
              <li><b>Destaques:</b> organize em sequência lógica: Quem sou → O método → Resultados → Depoimentos → Como funciona.</li>
              <li><b>Conteúdo:</b> use como ponto de partida 40% conexão, 30% autoridade, 20% prova e 10% oferta; ajuste depois com dados reais de alcance, salvamentos e conversão.</li>
            </ul>
          </div>
          <div style="text-align:center; margin-top:20px"><button class="btn btn-primary" onclick="location.reload()">Novo diagnóstico</button></div>
        </div>
      `;
    }

    function copyBio(btn, index) {
      const text = state.report?.bios?.[index]?.texto || '';
      navigator.clipboard.writeText(text).then(() => { btn.textContent = 'Copiado!'; setTimeout(() => btn.textContent = 'Copiar bio', 2000); });
    }

    render();
  </script>
</main>
</body>
